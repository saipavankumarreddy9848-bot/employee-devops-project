name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn -B clean package

    - name: Build Docker image
      run: docker build -t employee-app .

    - name: Save Docker image
      run: docker save employee-app > employee-app.tar

    - name: Copy to EC2
      uses: appleboy/scp-action@v0.1.3
      with:
        host: 3.7.249.110
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}
        source: "employee-app.tar"
        target: "/home/ec2-user/"

    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: 3.7.249.110
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker load < employee-app.tar
          docker stop app || true
          docker rm app || true
          docker run -d -p 8080:8080 --name app employee-app
