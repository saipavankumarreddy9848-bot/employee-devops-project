name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package

    # ✅ LOGIN TO DOCKER HUB
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
      - name: Debug Docker Username
      run: echo "USERNAME=${{ secrets.DOCKER_USERNAME }}"
      
        username: ${{ secrets.SAIPAVAN9848 }}
        password: ${{ secrets.SAIPAVAN9848 }}

    # ✅ BUILD IMAGE
    - name: Build Docker image
      run: docker build -t saipavan9848/saipavan-employee-app:latest .

    # ✅ PUSH IMAGE
    - name: Push Docker image
      run: docker push saipavan9848/saipavan-employee-app:latest

    # ✅ DEPLOY TO EC2
    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker rm -f app || true
          docker pull saipavan9848/saipavan-employee-app:latest
          docker run -d --name app --network mynet -p 8080:8080 saipavan9848/saipavan-employee-app:latest
